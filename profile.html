<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – CraveCart</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59f00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z'/%3E%3Cpath d='M6 17h12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body data-page="profile">
  <div class="page-wrap">
    <header class="navbar" id="fb-navbar"></header>

    <main class="page-main">
      <div class="page-head">
        <div class="container">
          <h1>👤 My Profile</h1>
          <p>Your account details and activity overview.</p>
        </div>
      </div>

      <div class="container section-pad" style="padding-top:0;">
        <div class="profile-layout">
          <!-- Left card -->
          <div class="profile-card">
            <div class="profile-avatar" id="pf-avatar">U</div>
            <h2 id="pf-name">Name</h2>
            <p class="p-email" id="pf-email">email</p>
            <p class="small muted">Member since <span id="pf-created">-</span></p>
          </div>

          <!-- Right content -->
          <div>
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-icon">🔖</div>
                <div class="stat-num" id="stat-saved">0</div>
                <div class="stat-lbl">Saved Recipes</div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">📖</div>
                <div class="stat-num" id="stat-created">0</div>
                <div class="stat-lbl">Created Recipes</div>
              </div>
              <div class="stat-card">
                <div class="stat-icon">📁</div>
                <div class="stat-num" id="stat-collections">0</div>
                <div class="stat-lbl">Collections</div>
              </div>
            </div>

            <div class="form-card" style="max-width:none;">
              <h3 style="margin-bottom:16px;">✏️ Edit Profile</h3>
              <form id="edit-name-form">
                <div class="form-group">
                  <label for="edit-name">Full Name</label>
                  <input type="text" id="edit-name" class="form-control" maxlength="60">
                </div>
                <div class="form-group">
                  <label>Email (read-only)</label>
                  <input type="email" class="form-control" id="pf-email-ro" disabled>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" id="fb-footer"></footer>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/collections.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
