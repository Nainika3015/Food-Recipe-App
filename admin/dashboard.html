<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – CraveCart Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59f00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z'/%3E%3Cpath d='M6 17h12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="admin-dashboard" class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>📊 Dashboard</h1>
          <div class="sub">CraveCart platform overview</div>
        </div>
        <div class="admin-top-actions">
          <button class="admin-burger" id="admin-burger">☰</button>
        </div>
      </div>

      <!-- Stat cards -->
      <div class="stats-row">
        <div class="dash-card">
          <div class="dash-icon i-users">👥</div>
          <div><div class="d-num" id="ad-total-users">0</div><div class="d-lbl">Total Users</div></div>
        </div>
        <div class="dash-card">
          <div class="dash-icon i-recipes">🍲</div>
          <div><div class="d-num" id="ad-total-recipes">0</div><div class="d-lbl">Total Recipes</div></div>
        </div>
        <div class="dash-card">
          <div class="dash-icon i-cats">🏷️</div>
          <div><div class="d-num" id="ad-total-cats">0</div><div class="d-lbl">Total Categories</div></div>
        </div>
        <div class="dash-card">
          <div class="dash-icon i-reviews">⭐</div>
          <div><div class="d-num" id="ad-total-reviews">0</div><div class="d-lbl">Total Reviews</div></div>
        </div>
        <div class="dash-card">
          <div class="dash-icon i-saved">🔖</div>
          <div><div class="d-num" id="ad-total-saved">0</div><div class="d-lbl">Total Saved Recipes</div></div>
        </div>
      </div>

      <!-- Panels -->
      <div class="dash-grid">
        <div class="admin-panel">
          <h2>🆕 Recently Added Recipes <a class="btn btn-ghost btn-sm" href="recipes.html">Manage →</a></h2>
          <div class="mini-list" id="ad-recent-recipes"></div>
        </div>
        <div class="admin-panel">
          <h2>🔥 Most Rated Recipes</h2>
          <div class="mini-list" id="ad-most-rated"></div>
        </div>
        <div class="admin-panel">
          <h2>🧑‍🍳 Recent Users <a class="btn btn-ghost btn-sm" href="users.html">Manage →</a></h2>
          <div class="mini-list" id="ad-recent-users"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/recipes.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
